<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="128" cy="128" r="124" fill="url(#bgGrad)" stroke="#059669" stroke-width="4"/>
  <!-- Inner White Circle -->
  <circle cx="128" cy="128" r="108" fill="url(#circleGrad)" stroke="#10b981" stroke-width="3"/>
  <!-- Fresh Food Icon / Emoji -->
  <text x="128" y="118" font-size="72" text-anchor="middle" dominant-baseline="central">🥬</text>
  <!-- Text: ຮ້ານຂາຍຜັກສົດ -->
  <text x="128" y="180" font-family="'Noto Sans Lao', 'Phetsarath', sans-serif" font-size="20" font-weight="bold" fill="#047857" text-anchor="middle">ຮ້ານຂາຍຜັກສົດ</text>
  <text x="128" y="202" font-family="sans-serif" font-size="11" font-weight="600" fill="#059669" letter-spacing="1.5" text-anchor="middle">FRESH MARKET</text>
</svg>
